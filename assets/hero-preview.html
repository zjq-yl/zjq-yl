<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ocean hero preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #031222; font-family: system-ui, sans-serif; }
    .hero { position: relative; width: min(1100px, 96vw); overflow: hidden; border-radius: 18px; box-shadow: 0 30px 90px #0009; cursor: crosshair; }
    .hero img { display: block; width: 100%; }
    .ripple { position: absolute; width: 50px; height: 50px; border: 1px solid #c8f2ffb8; border-radius: 50%; pointer-events: none; animation: ripple 2.2s ease-out forwards; }
    @keyframes ripple { from { transform: translate(-50%, -50%) scale(.2); opacity: .9; } to { transform: translate(-50%, -50%) scale(3); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ripple { animation-duration: .01ms; } }
  </style>
</head>
<body>
  <div class="hero" id="hero"><img src="hero.svg" alt="zjq-yl ocean hero"></div>
  <script>
    const hero = document.getElementById('hero');
    let lastRipple = 0;
    hero.addEventListener('pointermove', event => {
      if (performance.now() - lastRipple < 110) return;
      lastRipple = performance.now();
      const bounds = hero.getBoundingClientRect();
      if (event.clientY < bounds.top + bounds.height * .55) return;
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.left = `${event.clientX - bounds.left}px`;
      ripple.style.top = `${event.clientY - bounds.top}px`;
      hero.append(ripple);
      ripple.addEventListener('animationend', () => ripple.remove(), { once: true });
    });
  </script>
</body>
</html>
